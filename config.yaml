# Настройки поиска. Меняйте этот файл, код трогать не нужно.

# Ссылка с карты krisha.kz. Из неё берутся ТОЛЬКО город и границы района (areas=).
# Нарисуйте область на карте сайта и вставьте адресную строку целиком.
search_url: "https://krisha.kz/map/prodazha/kvartiry/almaty/?areas=p43.230382,76.859199,43.269322,76.948531,43.273065,76.975371,43.266627,76.995655,43.250154,76.996065,43.236224,76.98664,43.204458,76.998729,43.192316,76.989304,43.192166,76.95939,43.195464,76.957956,43.189767,76.920666,43.194115,76.9137,43.18527,76.896694,43.185719,76.874156,43.219894,76.844242,43.231131,76.859814"

# Фильтры поиска. Пустое значение (ничего после двоеточия или []) = фильтр не применяется.
# Чтобы "обнулить" фильтр — просто сотрите значение. Фильтры из самой ссылки НЕ используются.
filters:
  price_from:                # цена от, тенге. Пример: 30000000
  price_to: 100000000        # цена до, тенге
  rooms: []                  # число комнат списком: [1, 2, 3]. 5 означает "5 и больше"
  area_from:                 # общая площадь от, м². Пример: 55
  area_to:                   # общая площадь до, м²
  kitchen_from:              # площадь кухни от, м²
  kitchen_to:                # площадь кухни до, м²
  year_from:                 # год постройки от. Пример: 2020
  year_to:                   # год постройки до
  floor_from:                # этаж квартиры от
  floor_to:                  # этаж квартиры до
  not_last_floor:            # true = не последний этаж
  house_floors_from:         # этажей в доме от. Пример: 10
  house_floors_to:           # этажей в доме до
  building: []               # тип дома кодами сайта: 1 кирпичный, 2 панельный, 3 монолитный, 0 иное
  only_owners:               # true = только от хозяев
  only_with_photo:           # true = только с фото
  only_new_buildings:        # true = только новостройки
  # Любые другие параметры сайта "как есть" (имя из адресной строки: значение).
  # Примеры:  "das[flat.priv_dorm]": 2      не в общежитии
  #           "das[has_change]": 1          возможен обмен
  #           "das[_sys.fromAgent]": 1      отметка "Крыша Агент"
  #           "das[flat.toilet][]": [1, 2]  санузел, коды сайта
  extra: {}

# Сборщик: ведём себя как один неторопливый человек.
collector:
  pause_min_sec: 2.5      # пауза между запросами, от
  pause_max_sec: 5.0      # и до (выбирается случайно)
  max_pages: 100          # предохранитель от бесконечного цикла
  timeout_sec: 30

# Фото: качаются напрямую с фотосервера krisha, в карточки не заходим.
photos:
  dir: "data/photos"
  size: "750x470"          # размер файла; хватает для оценки ремонта и весит немного
  max_per_listing: 12      # больше фото на объявление не берём
  stop_after_misses: 5     # сколько пропусков подряд означает "фото кончились"
  pause_min_sec: 0.05
  pause_max_sec: 0.15

# ИИ. Для каждого этапа свой провайдер и модель — меняются здесь, код трогать не нужно.
#   claude_cli        — Claude по подписке, без API-ключа. Один раз выполнить: claude auth login
#   openai_compatible — Gemini, Groq, OpenRouter, Ollama и т.п. Пример:
#       provider: openai_compatible
#       base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
#       model: "gemini-2.5-flash"
#       api_key_env: "GEMINI_API_KEY"     # имя переменной окружения с ключом
llm:
  vision:                    # оценка фото и сверка с текстом
    provider: claude_cli
    model: sonnet
    timeout_sec: 300

# Корзины для разбивок в отчёте.
buckets:
  price_step_mln: 10                                   # 0-10, 10-20, ... млн тг
  year_edges: [1990, 2000, 2010, 2015, 2020, 2027]     # до 1990, 1990-2000, ..., 2027+

# Подбор аналогов.
comps:
  min_count: 5            # меньше аналогов -> помечаем "мало данных"
  area_tolerance: 0.20    # аналоги в пределах +-20% площади

# Файлы.
paths:
  database: "data/krisha.sqlite"
  report: "report.html"
