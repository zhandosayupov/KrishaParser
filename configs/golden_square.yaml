# Пробный поиск: Золотой квадрат (Абая – Толе би – Сейфуллина – Достык), без фильтров, только цена до 100 млн.
# Запуск: python run.py all --config configs/golden_square.yaml

# Ссылка с карты krisha.kz. Из неё берутся ТОЛЬКО город и границы района (areas=).
# Нарисуйте область на карте сайта и вставьте адресную строку целиком.
search_url: "https://krisha.kz/map/prodazha/kvartiry/almaty/?areas=p43.2385,76.9325,43.2560,76.9325,43.2560,76.9580,43.2385,76.9580,43.2385,76.9325"

# Фильтры поиска. Пустое значение (ничего после двоеточия или []) = фильтр не применяется.
# Чтобы "обнулить" фильтр — просто сотрите значение. Фильтры из самой ссылки НЕ используются.
filters:
  price_from:                # цена от, тенге. Пример: 30000000
  price_to: 100000000        # цена до, тенге
  rooms: []                  # число комнат списком: [1, 2, 3]. 5 означает "5 и больше"
  area_from:                 # общая площадь от, м². Пример: 55
  area_to:                   # общая площадь до, м²
  kitchen_from:              # площадь кухни от, м²
  kitchen_to:                # площадь кухни до, м²
  year_from:                 # год постройки от. Пример: 2020
  year_to:                   # год постройки до
  floor_from:                # этаж квартиры от
  floor_to:                  # этаж квартиры до
  not_last_floor:            # true = не последний этаж
  house_floors_from:         # этажей в доме от. Пример: 10
  house_floors_to:           # этажей в доме до
  building: []               # тип дома кодами сайта: 1 кирпичный, 2 панельный, 3 монолитный, 0 иное
  only_owners:               # true = только от хозяев
  only_with_photo:           # true = только с фото
  only_new_buildings:        # true = только новостройки
  # Любые другие параметры сайта "как есть" (имя из адресной строки: значение).
  # Примеры:  "das[flat.priv_dorm]": 2      не в общежитии
  #           "das[has_change]": 1          возможен обмен
  #           "das[_sys.fromAgent]": 1      отметка "Крыша Агент"
  #           "das[flat.toilet][]": [1, 2]  санузел, коды сайта
  extra: {}

# Сборщик: ведём себя как один неторопливый человек.
collector:
  pause_min_sec: 2.5      # пауза между запросами, от
  pause_max_sec: 5.0      # и до (выбирается случайно)
  max_pages: 3000         # предохранитель от бесконечного цикла
  timeout_sec: 30

# Фото: качаются напрямую с фотосервера krisha, в карточки не заходим.
photos:
  dir: "data/photos"
  size: "750x470"          # размер файла; хватает для оценки ремонта и весит немного
  max_per_listing: 12      # больше фото на объявление не берём
  stop_after_misses: 5     # сколько пропусков подряд означает "фото кончились"
  threads: 8               # сколько объявлений качать одновременно; 1 = по очереди
  pause_min_sec: 0.05
  pause_max_sec: 0.15

# ИИ. Для каждого этапа свой провайдер и модель — меняются здесь, код трогать не нужно.
#   claude_cli        — Claude по подписке, без API-ключа. Один раз выполнить: claude auth login
#   openai_compatible — Gemini, Groq, OpenRouter, Ollama и т.п. Пример:
#       provider: openai_compatible
#       base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
#       model: "gemini-2.5-flash"
#       api_key_env: "GEMINI_API_KEY"     # имя переменной окружения с ключом
llm:
  vision:                    # оценка фото и сверка с текстом
    provider: claude_cli
    model: haiku             # дешёвая модель: экономим лимит подписки. Точнее, но дороже: sonnet
    timeout_sec: 300
    threads: 8               # сколько квартир оценивать одновременно (быстрее, но лимит тратится так же)
    # thinking_tokens: 0     # «размышления» модели перед ответом (для claude_cli). 0 — выключены: лимит тратится в разы медленнее
  analyst:                   # итоговый вердикт по лучшим кандидатам (только текст, без картинок)
    provider: claude_cli
    model: haiku
    timeout_sec: 180
    threads: 8               # сколько вердиктов запрашивать одновременно

# Расчёт выгоды. Все суммы — примерные оценки для Алматы, поправьте под своё понимание рынка.
benefit:
  combine: min               # как сводить три оценки (ЖК, окружение, район): min — самая пессимистичная, avg — среднее
  ready_from_level: 7        # с какого уровня отделки квартира считается «готовой» (ниже — «под ремонт»)
  small_flat_max_m2: 50      # до этой площади квартира считается маленькой (свой набор и цены техники)

  # Материалы на ремонт до хорошего состояния (уровень 8), тенге за м². Работа не учитывается:
  # многое можно сделать самому. Минус у 9 и 10 — ремонт лучше хорошего, это добавленная стоимость.
  #  1 без отделки   2 черновая   3 предчистовая   4 убитая   5 «бабушкин»
  #  6 простая отделка   7 аккуратный не новый   8 хороший   9 очень хороший   10 премиум
  renovation_per_m2: {1: 70000, 2: 60000, 3: 45000, 4: 60000, 5: 50000, 6: 25000, 7: 15000, 8: 0, 9: -15000, 10: -35000}

  # Мебель, тенге за м² площади квартиры (средний класс), и поправка на класс.
  furniture_per_m2: {partial: 15000, full: 35000}
  furniture_class_factor: {economy: 0.6, mid: 1.0, premium: 1.8}
  kitchen_set_value: [600000, 1000000]       # кухонный гарнитур: [в маленькой, в большой]

  # Техника: [цена для маленькой квартиры, для большой]. 0 = в такой квартире не нужна и в выгоду не идёт.
  appliance_prices:
    fridge:     [200000, 350000]
    washer:     [150000, 230000]
    cooktop:    [70000, 120000]
    oven:       [0, 130000]
    hood:       [40000, 70000]
    dishwasher: [0, 200000]
    microwave:  [40000, 50000]
    boiler:     [60000, 80000]
    ac:         [180000, 180000]
    tv:         [120000, 200000]

# Аналитик: вердикт ИИ по лучшим кандидатам.
analyst:
  top_per_scenario: 10       # сколько лучших по выгоде брать в каждом сценарии
  min_benefit_pct: 3         # квартиры с выгодой меньше этого аналитику не показываем

# Корзины для разбивок в отчёте.
buckets:
  price_step_mln: 10                                   # 0-10, 10-20, ... млн тг
  # Границы корзин года постройки. Новые дома (с 2020) — по одному году.
  year_edges: [1990, 2000, 2010, 2015, 2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027]

# Подбор аналогов.
comps:
  year_edges: [1990, 2000, 2010, 2015, 2020, 2027]   # «те же годы постройки» для окружения
  min_count: 5            # меньше аналогов -> помечаем "мало данных"
  area_tolerance: 0.40    # аналоги в пределах +-40% площади (цена за м² в Казахстане слабо зависит от площади)

# Файлы.
paths:
  database: "data/golden_square.sqlite"
  report: "report_golden_square.html"
